name: world-cup-predictor

on:
  push:
    paths: ["world-cup-predictor/**", ".github/workflows/world-cup-predictor.yml"]
  pull_request:
    paths: ["world-cup-predictor/**", ".github/workflows/world-cup-predictor.yml"]

defaults:
  run:
    working-directory: world-cup-predictor

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest --cov --cov-report=term-missing
